name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2
      - name: Test
        run: |
          python -m py_compile app.py core.py
          python -m unittest discover -p "test_*.py"
          python tools/license_audit.py
          python tools/secret_scan.py
      - name: Build
        run: pyinstaller --noconfirm --clean "暖言聊天自动回复助手.spec"
      - name: Verify and package
        shell: pwsh
        run: |
          $releaseDir = "dist/暖言聊天自动回复助手"
          Copy-Item README.md,LICENSE,PRIVACY.md,THIRD_PARTY_NOTICES.txt,THIRD_PARTY_COMPONENTS.md -Destination $releaseDir
          Copy-Item THIRD_PARTY_LICENSES -Destination $releaseDir -Recurse
          python tools/license_audit.py --release-dir $releaseDir
          & "$releaseDir/暖言聊天自动回复助手.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged self-test failed: $LASTEXITCODE" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "nuanyan-chat-auto-reply-v$version-Windows-x64.zip"
          $exeHash = (Get-FileHash "$releaseDir/暖言聊天自动回复助手.exe" -Algorithm SHA256).Hash
          "$exeHash  暖言聊天自动回复助手.exe" | Set-Content "$releaseDir/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash
          @(
            "$zipHash  $zip",
            "$exeHash  暖言聊天自动回复助手.exe"
          ) | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: nuanyan-windows-x64
          path: |
            nuanyan-chat-auto-reply-v*-Windows-x64.zip
            SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nuanyan-chat-auto-reply-v*-Windows-x64.zip
            SHA256SUMS.txt
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          draft: false
          prerelease: false
